<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Películas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Gestión de Películas</h1>
        
        <!-- Formulario para agregar películas -->
        <div class="card mb-4">
            <div class="card-header">
                <h2>Agregar Nueva Película</h2>
            </div>
            <div class="card-body">
                <form id="formPelicula">
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" class="form-control" id="titulo" required>
                    </div>
                    <div class="mb-3">
                        <label for="director" class="form-label">Director</label>
                        <input type="text" class="form-control" id="director">
                    </div>
                    <div class="mb-3">
                        <label for="anio" class="form-label">Año de Estreno</label>
                        <input type="number" class="form-control" id="anio" required>
                    </div>
                    <div class="mb-3">
                        <label for="genero" class="form-label">Género</label>
                        <input type="text" class="form-control" id="genero">
                    </div>
                    <button type="submit" class="btn btn-primary">Agregar Película</button>
                </form>
            </div>
        </div>
        
        <!-- Filtro por año -->
        <div class="card mb-4">
            <div class="card-header">
                <h2>Filtrar Películas</h2>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="number" class="form-control" id="filtroAnio" placeholder="Filtrar por año...">
                    <button class="btn btn-outline-secondary" type="button" id="btnFiltrar">Filtrar</button>
                    <button class="btn btn-outline-danger" type="button" id="btnLimpiar">Mostrar Todas</button>
                </div>
            </div>
        </div>
        
        <!-- Tabla de películas -->
        <div class="card">
            <div class="card-header">
                <h2>Listado de Películas</h2>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Director</th>
                            <th>Año</th>
                            <th>Género</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPeliculas">
                        <!-- Las películas se cargarán aquí dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
