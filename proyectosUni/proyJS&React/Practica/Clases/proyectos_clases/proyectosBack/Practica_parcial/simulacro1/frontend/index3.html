<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Películas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="mb-4">Gestión de Películas</h1>

    <!-- Filtros -->
    <div class="mb-4">
      <div class="row">
        <div class="col-md-4">
          <label for="anioFiltro" class="form-label">Año de estreno</label>
          <input type="number" id="anioFiltro" class="form-control" placeholder="Ej. 2020">
        </div>
        <div class="col-md-4">
          <label for="tituloFiltro" class="form-label">Título contiene</label>
          <input type="text" id="tituloFiltro" class="form-control" placeholder="Buscar por título...">
        </div>
        <div class="col-md-4">
          <label for="generoFiltro" class="form-label">Género</label>
          <select id="generoFiltro" class="form-select">
            <option value="">Todos</option>
            <option value="Acción">Acción</option>
            <option value="Comedia">Comedia</option>
            <option value="Drama">Drama</option>
            <option value="Terror">Terror</option>
            <!-- Puedes agregar más géneros -->
          </select>
        </div>
      </div>
      <button class="btn btn-primary mt-3" id="btnFiltrar">Aplicar Filtros</button>
    </div>

    <!-- Tabla de películas -->
    <table class="table table-striped" id="tablaPeliculas">
      <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Título</th>
            <th>Director</th>
            <th>Año</th>
            <th>Género</th>
        </tr>
      </thead>
      <tbody>
        <!-- Películas se insertarán aquí -->
      </tbody>
    </table>

    <!-- Formulario para agregar nueva película -->
    <h2 class="mt-5">Agregar Nueva Película</h2>
    <form id="formPelicula">
      <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        <input type="text" id="titulo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="director" class="form-label">Director</label>
        <input type="text" id="director" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="anio" class="form-label">Año de Estreno</label>
        <input type="number" id="anio" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="genero" class="form-label">Género</label>
        <input type="text" id="genero" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success">Agregar Película</button>
    </form>

    <!-- Formulario para modificar el año de una película -->
    <h2 class="mt-5">Modificar Año de una Película</h2>
    <form id="formActualizarAnio">
      <div class="mb-3">
        <label for="idPelicula" class="form-label">ID de la Película</label>
        <input type="number" id="idPelicula" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="nuevoAnio" class="form-label">Nuevo Año</label>
        <input type="number" id="nuevoAnio" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-warning">Actualizar Año</button>
    </form>
  </div>
<script src> </script>

</body>
</html>
